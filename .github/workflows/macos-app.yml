name: Build Mac app

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify Tk
        run: |
          python -c "import tkinter; print('tk', tkinter.TkVersion)"

      - name: Package
        run: |
          python -m pip install --upgrade pip pyinstaller
          pyinstaller --noconfirm --windowed \
            --name "Garmin Map Combiner" \
            --osx-bundle-identifier dev.wilsonsamiano.garmin-map-combiner \
            --hidden-import tkinter \
            --hidden-import tkinter.ttk \
            --hidden-import tkinter.filedialog \
            --hidden-import tkinter.messagebox \
            --argv-emulation \
            garmin_map_combiner.py
          ditto -c -k --sequesterRsrc --keepParent \
            "dist/Garmin Map Combiner.app" \
            "Garmin-Map-Combiner-macOS.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: Garmin-Map-Combiner-macOS
          path: Garmin-Map-Combiner-macOS.zip

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          name: v1.0.0 — Garmin Map Combiner
          files: Garmin-Map-Combiner-macOS.zip
          generate_release_notes: true
          body: |
            Unsigned macOS app. After unzipping: right-click **Garmin Map Combiner.app** → Open.

            You still need:
            - Java (`brew install openjdk`)
            - [mkgmap.jar](https://www.mkgmap.org.uk/download/mkgmap.html)

            Copy the combined file to the SD card as `Garmin/gmapsupp.img` (under 4 GB, FAT32).
