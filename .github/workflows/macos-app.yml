name: Build Mac app

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Package
        run: |
          python -m pip install --upgrade pip pyinstaller
          pyinstaller --noconfirm --windowed --name "Garmin Map Combiner" garmin_map_combiner.py
          ditto -c -k --sequesterRsrc --keepParent "dist/Garmin Map Combiner.app" "Garmin-Map-Combiner-macOS.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: Garmin-Map-Combiner-macOS
          path: Garmin-Map-Combiner-macOS.zip
